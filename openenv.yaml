# OpenEnv specification for Proxima Auto-Scaler
# Ref: https://github.com/openenv-dev/openenv

name: proxima-autoscaler
version: "0.1.0"
description: >
  RL-powered cloud auto-scaling agent that learns optimal
  server provisioning policies under dynamic workloads.

environment:
  module: src.env.cloud_env
  class: CloudAutoScalingEnv

schemas:
  observation: src.env.schemas.Observation
  action: src.env.schemas.Action
  reward: src.env.schemas.Reward

tasks:
  easy:
    description: >
      Predictable sinusoidal workload with low variance and
      single-step server boot delay.
    difficulty: easy
    grader: deterministic
  medium:
    description: >
      Fluctuating workload with moderate noise, MMPP burst
      patterns, and two-step boot delay.
    difficulty: medium
    grader: deterministic
  hard:
    description: >
      Highly unpredictable demand with aggressive spikes, high
      noise variance, and three-step boot delay.
    difficulty: hard
    grader: deterministic

deployment:
  framework: fastapi
  entrypoint: app:app
  port: 7860
