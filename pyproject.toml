[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-autoscaling-rl"
version = "0.1.0"
description = "Intelligent Cloud Auto-Scaling using Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.0",
  "gymnasium>=0.29",
  "stable-baselines3[extra]>=2.3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "matplotlib>=3.8",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = true
