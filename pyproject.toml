[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-autoscaling-openenv"
version = "1.0.0"
description = "Cloud autoscaling OpenEnv environment"
requires-python = ">=3.11"
dependencies = [
  "openenv-core>=0.2.0",
  "fastapi>=0.135.3",
  "uvicorn>=0.44.0",
  "pydantic>=2.12.5",
]

[project.scripts]
server = "server.app:main"
