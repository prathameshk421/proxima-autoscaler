[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proxima-autoscaler"
version = "0.1.0"
description = "RL-powered cloud auto-scaling agent (Meta-PyTorch Hackathon)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "scipy",
    "stable-baselines3",
    "torch",
    "gymnasium",
    "fastapi",
    "uvicorn",
    "openai",
    "python-dotenv",
    "openenv-core>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[project.scripts]
serve = "server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src", "server"]



[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "B905", "SIM108"]

[tool.ruff.lint.isort]
known-first-party = ["src"]